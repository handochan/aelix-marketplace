name: validate-catalog

# Runs the authoritative catalog validator on every change. Because
# scripts/validate_catalog.py imports the REAL parser
# (aelix_coding_agent.cli.extension_catalog.parse_catalog) and asserts that it
# keeps every entry, a merged catalog.json is guaranteed to parse exactly as
# aelix will read it -- the published catalog is authoritative-validated, not
# merely schema-valid.

on:
  push:
    paths:
      - "catalog.json"
      - "catalog.schema.json"
      - "scripts/validate_catalog.py"
      - ".github/workflows/validate-catalog.yml"
  pull_request:
    paths:
      - "catalog.json"
      - "catalog.schema.json"
      - "scripts/validate_catalog.py"
      - ".github/workflows/validate-catalog.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-python v5.3.0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"

      - name: Install dependencies
        # aelix is NOT on PyPI during beta. Its four packages are mutually pinned
        # at the same version (==0.1.0b1), so a single-package git install cannot
        # resolve its siblings from PyPI. Clone the source and install the three
        # needed packages TOGETHER so the sibling pins resolve from the local
        # checkout (third-party deps still come from PyPI). Once aelix publishes to
        # PyPI this simplifies to `pip install aelix-coding-agent jsonschema`.
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 https://github.com/handochan/aelix-ai.git /tmp/aelix-src
          python -m pip install jsonschema \
            /tmp/aelix-src/packages/aelix-ai \
            /tmp/aelix-src/packages/aelix-agent-core \
            /tmp/aelix-src/packages/aelix-coding-agent

      - name: Validate catalog
        run: python scripts/validate_catalog.py
